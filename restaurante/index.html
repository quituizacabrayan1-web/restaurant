<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Restaurant Pro System</title>

<style>
/* FONDO TIPO RESTAURANTE */
body {
  margin: 0;
  font-family: Arial;
  background: url("https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=1600&q=80") no-repeat center center fixed;
  background-size: cover;
  color: white;
}

/* overlay oscuro */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 26px;
  font-weight: bold;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(5px);
}

/* GRID MESAS */
.container {
  display: grid;
  grid-template-columns: repeat(4, 150px);
  gap: 25px;
  justify-content: center;
  padding: 40px;
}

/* MESAS */
.table {
  height: 140px;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: 0.3s;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
}

.table:hover {
  transform: scale(1.07);
}

/* ESTADOS */
.free {
  background: rgba(34,197,94,0.85);
}

.occupied {
  background: rgba(239,68,68,0.85);
}

.reserved {
  background: rgba(250,204,21,0.9);
  color: #111;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  width: 320px;
}

input, select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  border: none;
  outline: none;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.save {
  background: #3b82f6;
  color: white;
}

.close {
  background: #ef4444;
  color: white;
}

small {
  display: block;
  margin-top: 5px;
  font-weight: normal;
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="overlay"></div>

<header>🍽️ Restaurant Pro Reservation System</header>

<div class="container" id="container"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="title">Mesa</h3>

    <select id="estado">
      <option value="free">Libre</option>
      <option value="occupied">Ocupada</option>
      <option value="reserved">Reservada</option>
    </select>

    <input id="cliente" placeholder="Nombre cliente">
    <input type="date" id="fecha">
    <input type="time" id="hora">

    <button class="save" onclick="guardar()">Guardar reserva</button>
    <button class="close" onclick="cerrar()">Cerrar</button>
  </div>
</div>

<script>
let mesas = [];
let selected = null;

const container = document.getElementById("container");
const modal = document.getElementById("modal");

for (let i = 1; i <= 12; i++) {
  mesas.push({
    id: i,
    estado: "free",
    cliente: "",
    fecha: "",
    hora: ""
  });
}

function render() {
  container.innerHTML = "";

  mesas.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = `table ${m.estado}`;

    div.innerHTML = `
      <div>Mesa ${m.id}</div>
      <small>${info(m)}</small>
    `;

    div.onclick = () => openModal(i);

    container.appendChild(div);
  });
}

function info(m) {
  if (m.estado === "reserved") {
    return `${m.cliente} | ${m.fecha} ${m.hora}`;
  }
  if (m.estado === "occupied") return "Ocupada";
  return "Libre";
}

function openModal(i) {
  selected = i;
  let m = mesas[i];

  document.getElementById("title").innerText = "Mesa " + m.id;
  document.getElementById("estado").value = m.estado;
  document.getElementById("cliente").value = m.cliente;
  document.getElementById("fecha").value = m.fecha;
  document.getElementById("hora").value = m.hora;

  modal.style.display = "flex";
}

function cerrar() {
  modal.style.display = "none";
}

function guardar() {
  let m = mesas[selected];

  let estado = document.getElementById("estado").value;
  let cliente = document.getElementById("cliente").value;
  let fecha = document.getElementById("fecha").value;
  let hora = document.getElementById("hora").value;

  // validación PRO
  if (estado === "reserved" && (!cliente || !fecha || !hora)) {
    alert("Completa todos los datos para reservar");
    return;
  }

  m.estado = estado;
  m.cliente = cliente;
  m.fecha = fecha;
  m.hora = hora;

  if (estado !== "reserved") {
    m.cliente = "";
    m.fecha = "";
    m.hora = "";
  }

  cerrar();
  render();
}

window.onclick = (e) => {
  if (e.target === modal) cerrar();
};

render();
</script>

</body>
</html>
